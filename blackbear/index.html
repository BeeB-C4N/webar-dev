<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        height: 100%;
        background-color: #fff;
      }

      model-viewer {
        display: block;
        width: 100%;
        height: calc(100vh - 100px); /* オーディオバーの分 */
      }

      #audio-container {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: rgba(255, 255, 255, 0.96);
        padding: 8px 16px;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #audio-container h2 {
        margin: 0;
        font-size: 14px;
        color: #333;
      }

      #narration {
        width: 60%;
        max-width: 400px;
      }

      #custom-ar-button {
        background-color: #2c3e50;
        color: #fff;
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
      }

      #custom-ar-button:hover {
        background-color: #1a252f;
      }
    </style>
  </head>

  <body>
    <!-- 3Dモデル -->
    <model-viewer
      id="viewer"
      src="./blackbear_yihsuanchen13.glb"
      ios-src="./blackbear_yihsuanchen13.usdz"
      ar
      ar-modes="scene-viewer webxr quick-look"
      auto-rotate
      camera-controls
      alt="AsianBlackBear">
    </model-viewer>

    <!-- オーディオガイド + ARボタン -->
    <div id="audio-container">
      <h2>解説ガイド</h2>
      <audio id="narration" controls src="../Mitsuke.wav"></audio>
      <button id="custom-ar-button">ARで大きさ確認</button>
    </div>

    <script>
      const viewer = document.getElementById('viewer');
      const arButton = document.getElementById('custom-ar-button');

      arButton.addEventListener('click', () => {
        viewer.activateAR();
      });
    </script>
  </body>
</html>
