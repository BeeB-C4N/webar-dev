<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #fff;
    }
    model-viewer {
      display: block;
      width: 100%;
      height: calc(100vh - 120px);
    }
    #audio-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.96);
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
      z-index: 10;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .audio-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .audio-header h2 {
      margin: 0;
      font-size: 14px;
      color: #333;
    }
    .ar-link {
      font-size: 14px;
      color: #2c3e50;
      text-decoration: underline;
      cursor: pointer;
    }
    .ar-link:hover {
      color: #1a252f;
    }
    #narration {
      width: 90%;
      max-width: 600px;
    }

    /* モーダル */
    #ar-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #ar-modal .box {
      min-width: 240px;
      max-width: 80vw;
      background: #fff;
      color: #333;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      padding: 20px 24px;
      text-align: center;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <model-viewer
    id="viewer"
    src="./dino_move.glb"
    ios-src="./dino_move4.usdz"
    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-placement="floor"
    auto-rotate
    camera-controls
    alt="AsianBlackBear">
  </model-viewer>

  <!-- モーダル -->
  <div id="ar-modal" role="dialog" aria-modal="true" aria-label="AR表示中">
    <div class="box">ARを表示中...</div>
  </div>

  <!-- オーディオガイド -->
  <div id="audio-container">
    <div class="audio-header">
      <h2>解説ガイド</h2>
      <span class="ar-link" onclick="openAR()">ARで表示</span>
    </div>
    <audio id="narration" controls src="./BlackBear2.wav"></audio>
  </div>

  <script>
    function showARModal() {
      const modal = document.getElementById('ar-modal');
      modal.style.display = 'flex';
      setTimeout(() => {
        modal.style.display = 'none';
      }, 7000);
    }

    async function openAR() {
      showARModal();
      const viewer = document.getElementById('viewer');
      try {
        await viewer.activateAR();
      } catch (e) {
        console.warn('AR起動に失敗:', e);
      }
    }
  </script>
</body>
</html>
